<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Group</title>
  <meta name="description" content="Ongoing research and publications of the research group.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <nav aria-label="Sections">
        <a href="#ongoing">Ongoing<span class="more"> research</span></a>
        <a href="#published">Published<span class="more"> papers</span></a>
        <a href="#members">Members</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="wrap hero-grid">
        <div class="hero-text">
          <p class="hero-where" id="hero-where"></p>
          <h1 id="hero-title">Research Group</h1>
          <p class="hero-tagline" id="hero-tagline"></p>
          <p class="hero-interests" id="hero-interests"></p>
          <p class="hero-super" id="hero-super"></p>
        </div>
      </div>
    </section>

    <section class="section" id="ongoing" aria-labelledby="h-ongoing">
      <div class="wrap">
        <h2 id="h-ongoing">Ongoing research</h2>
        <p class="section-note">Work in progress. Details are kept brief until publication.</p>
        <div class="cards" id="ongoing-list"></div>
      </div>
    </section>

    <section class="section section-alt" id="published" aria-labelledby="h-published">
      <div class="wrap">
        <h2 id="h-published">Published papers</h2>
        <p class="section-note">Earlier publications from the group.</p>
        <div id="published-list"></div>
      </div>
    </section>

    <section class="section" id="members" aria-labelledby="h-members">
      <div class="wrap">
        <h2 id="h-members">Members</h2>
        <div id="pi-card"></div>
        <ul class="people" id="member-list"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p id="footer-contact"></p>
      <p id="footer-updated"></p>
    </div>
  </footer>

  <noscript><p class="wrap noscript">Please turn on JavaScript to see the research list.</p></noscript>
  <script>
    // If data.js has a mistake, remember where, so the page can point to it.
    window.addEventListener("error", function (e) {
      if (e.filename && /data\.js/.test(e.filename) && !window.__dataError) {
        window.__dataError = { line: e.lineno, message: e.message };
      }
    });
  </script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
